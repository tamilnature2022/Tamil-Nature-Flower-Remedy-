
name: Ephemera Test Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'ephemera-test/**'
      - 'settings.gradle.kts'
      - '.github/workflows/Ephemera-Test.yml'
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Run Dasha Unit Tests
        run: gradle --no-daemon :ephemera-test:testDebugUnitTest --stacktrace

      - name: Build Ephemera Test
        run: gradle --no-daemon :ephemera-test:assembleDebug --stacktrace --info

      - name: Upload Test APK
        uses: actions/upload-artifact@v4
        with:
          name: Ephemera-Test-APK
          path: ephemera-test/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
